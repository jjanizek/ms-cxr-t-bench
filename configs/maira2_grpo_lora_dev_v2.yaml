model:
  name: microsoft/maira-2
  torch_dtype: float16
  device: cuda:1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  prompts_dir: data/rl_prompts/seed42
  images_root: data/raw/images
  pair_single_ratio: 0.75   # was 0.5 in dev; bias toward pair gradient

prompting:
  prompt_mode: specific
  technique: "AP portable chest radiograph."
  indication: ""

sampling:
  group_size: 4
  max_new_tokens: 150
  temperature: 0.9
  top_p: 0.95

reward:
  alpha_label: 1.0
  beta_no_compare: 0.5      # was 1.0 in dev; downweight no-compare reward
  partial_credit: false

judge:
  api: openai
  model: gpt-4.1-mini
  concurrency: 16

train:
  num_steps: 100
  batch_prompts: 2
  lr: 1.0e-5
  weight_decay: 0.0
  kl_coef: 0.05
  grad_clip: 1.0
  ppo_clip: 0.2
  ppo_epochs: 1
  grad_checkpointing: true
  logp_chunk_size: 2

eval:
  every_n_steps: 25
  n_pair_eval: 50
  n_single_eval: 25

checkpoint:
  dir: checkpoints/maira2_grpo_lora_dev_v2
  save_every_n_steps: 25
  keep_last_n: 3

logging:
  out_dir: results/maira2_grpo_lora_dev_v2
  log_every_n_steps: 1
