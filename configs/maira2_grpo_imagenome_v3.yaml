# v3: address v2's mode collapse to "none" by removing the escape hatch.
#  - v1 (partial_credit=true, 4-class judge) → collapsed to "stable" (97%)
#  - v2 (partial_credit=false, 4-class judge, gt-stratified) → collapsed to "none" (64%)
#  - v3: use 3-class judge prompt for reward — ambiguous/non-committal reports
#    default to "stable" (which under stratified gt batches still yields negative
#    expected reward on 2/3 cases, so the model is incentivized to commit when
#    its accuracy beats 33%).

model:
  name: microsoft/maira-2
  torch_dtype: float16
  device: cuda:1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

vision_lora:
  enabled: false
  last_n_layers: 6

data:
  prompts_dir: data/rl_prompts/imagenome
  images_root: /data/mimic-cxr-jpg
  pair_single_ratio: 1.0
  stratify_by_finding: true
  stratify_by_gt_progression: true

prompting:
  prompt_mode: specific
  technique: "AP portable chest radiograph."
  indication: ""

sampling:
  group_size: 4
  max_new_tokens: 150
  temperature: 0.9
  top_p: 0.95

reward:
  alpha_label: 1.0
  beta_no_compare: 0.0
  partial_credit: false       # binary reward (kept from v2)

judge:
  api: openai
  model: gpt-4.1-mini
  concurrency: 32
  prompt_mode: 3class         # NEW: use OG 3-class prompt — no "none" escape valve

train:
  num_steps: 1000
  batch_prompts: 2
  lr: 5.0e-6
  weight_decay: 0.0
  kl_coef: 0.1
  grad_clip: 1.0
  ppo_clip: 0.2
  ppo_epochs: 1
  grad_checkpointing: true
  logp_chunk_size: 2

eval:
  every_n_steps: 100
  n_pair_eval: 100
  n_single_eval: 0

checkpoint:
  dir: checkpoints/maira2_grpo_imagenome_v3
  save_every_n_steps: 100
  keep_last_n: 10

logging:
  out_dir: results/maira2_grpo_imagenome_v3
  log_every_n_steps: 1
