# v8: v6 setup, but give the projector LoRA 10× the LR of the LM LoRA, and
# run longer. Tests the "vision side wants more training, but LM falls apart
# if pushed too hard" intuition by decoupling their effective update rates.
#
# Other v6 settings unchanged (frozen rad-DINO, r=32, change-only train).
# kl_coef stays at the v6 value because we are NOT swapping the encoder.

model:
  name: microsoft/maira-2
  torch_dtype: float16
  device: cuda:1               # queued after SFT — GPU 0 OOMs even at batch=1 (500MB smaller than GPU 1)

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - multi_modal_projector.layers.0
    - multi_modal_projector.layers.2
    - multi_modal_projector.layers.4
    - multi_modal_projector.layers.6

vision_lora:
  enabled: false
  last_n_layers: 6

data:
  prompts_dir: data/rl_prompts/imagenome
  images_root: /data/mimic-cxr-jpg
  pair_single_ratio: 1.0
  stratify_by_finding: true
  stratify_by_gt_progression: true
  train_classes: [improving, worsening]

prompting:
  prompt_mode: specific
  technique: "AP portable chest radiograph."
  indication: ""

sampling:
  group_size: 4
  max_new_tokens: 150
  temperature: 0.9
  top_p: 0.95

reward:
  alpha_label: 1.0
  beta_no_compare: 0.0
  partial_credit: false
  change_weight: 1.0
  stable_weight: 1.0
  wrong_penalty: 1.0

judge:
  api: openai
  model: gpt-4.1-mini
  concurrency: 32
  prompt_mode: 3class

train:
  num_steps: 600              # longer than v6's effective best at step 99 — see if higher-LR projector finds a better plateau
  batch_prompts: 2            # GPU 1 (24GB) fits batch=2 fine; queued after SFT finishes
  lr: 5.0e-6                  # default LR (LM LoRA)
  lr_groups:
    multi_modal_projector: 5.0e-5  # 10× for projector LoRA
  weight_decay: 0.0
  kl_coef: 0.1
  grad_clip: 1.0
  ppo_clip: 0.2
  ppo_epochs: 1
  grad_checkpointing: true
  logp_chunk_size: 2

eval:
  every_n_steps: 50
  n_pair_eval: 100
  n_single_eval: 0

checkpoint:
  dir: checkpoints/maira2_grpo_imagenome_v8
  save_every_n_steps: 50
  keep_last_n: 14

logging:
  out_dir: results/maira2_grpo_imagenome_v8
  log_every_n_steps: 1
