# v4: class-weighted reward to break the "stable Schelling point".
#  - v1 (partial_credit=true, 4-class judge)        → mode collapse to "stable" (97%)
#  - v2 (partial_credit=false, 4-class judge)       → mode collapse to "none"   (64%)
#  - v3 (binary +1/-1, 3-class judge, gt-stratified) → still 79% stable at step 99,
#       macro_acc 0.302 (worse than baseline 0.325). R ≈ -0.30 plateau because
#       "always stable" with binary symmetric reward + gt-stratified batches has
#       expected reward 1/3 - 2/3 = -0.33 — barely worse than the model's
#       actual policy, so gradients can't escape the local optimum.
#  - v4: asymmetric reward — +2 for correct improving/worsening, +1 for correct
#       stable, -1 for wrong. Under gt-stratified sampling "always stable" still
#       yields 1/3 - 2/3 = -0.33, but a policy that commits to changes 50% of
#       the time with 50% accuracy gets +0.17 expected — change-commitment now
#       pays. Keep the 3-class judge to remove the "none" escape valve.

model:
  name: microsoft/maira-2
  torch_dtype: float16
  device: cuda:1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

vision_lora:
  enabled: false
  last_n_layers: 6

data:
  prompts_dir: data/rl_prompts/imagenome
  images_root: /data/mimic-cxr-jpg
  pair_single_ratio: 1.0
  stratify_by_finding: true
  stratify_by_gt_progression: true

prompting:
  prompt_mode: specific
  technique: "AP portable chest radiograph."
  indication: ""

sampling:
  group_size: 4
  max_new_tokens: 150
  temperature: 0.9
  top_p: 0.95

reward:
  alpha_label: 1.0
  beta_no_compare: 0.0
  partial_credit: false
  change_weight: 2.0          # NEW: +2 for correct improving / worsening
  stable_weight: 1.0          # NEW: +1 for correct stable
  wrong_penalty: 1.0          # NEW: -1 for wrong

judge:
  api: openai
  model: gpt-4.1-mini
  concurrency: 32
  prompt_mode: 3class

train:
  num_steps: 1000
  batch_prompts: 2
  lr: 5.0e-6
  weight_decay: 0.0
  kl_coef: 0.1
  grad_clip: 1.0
  ppo_clip: 0.2
  ppo_epochs: 1
  grad_checkpointing: true
  logp_chunk_size: 2

eval:
  every_n_steps: 100
  n_pair_eval: 100
  n_single_eval: 0

checkpoint:
  dir: checkpoints/maira2_grpo_imagenome_v4
  save_every_n_steps: 100
  keep_last_n: 10

logging:
  out_dir: results/maira2_grpo_imagenome_v4
  log_every_n_steps: 1
