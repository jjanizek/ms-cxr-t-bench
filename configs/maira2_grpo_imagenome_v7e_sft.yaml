# v7e-after-SFT: GRPO starting from the SFT-warmed adapter at step 999.
#
# Memory-slim for GPU 0 (500MB less than GPU 1, OOMs at v6-style settings):
#   batch_prompts=1, group_size=2, logp_chunk_size=1.
#
# Otherwise same recipe as v7e: BioViL-T ensemble vision tower, change-only
# training, kl_coef=0 (reference is meaningless after vision swap), 3-class
# judge. NaN-grad filter from main script still in place.

model:
  name: microsoft/maira-2
  torch_dtype: float16
  device: cuda:0

vision_swap: biovil_t_ensemble
vision_swap_freeze_backbone: true
vision_swap_finding_ckpts:
  consolidation: checkpoints/biovil_t_imagenome/consolidation_seed42_best.pt
  edema: checkpoints/biovil_t_imagenome/edema_seed42_best.pt
  pleural_effusion: checkpoints/biovil_t_imagenome/pleural_effusion_seed42_best.pt
  pneumonia: checkpoints/biovil_t_imagenome/pneumonia_seed42_best.pt
  pneumothorax: checkpoints/biovil_t_imagenome/pneumothorax_seed42_best.pt

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - multi_modal_projector.layers.0
    - multi_modal_projector.layers.2
    - multi_modal_projector.layers.4
    - multi_modal_projector.layers.6

vision_lora:
  enabled: false
  last_n_layers: 6

data:
  prompts_dir: data/rl_prompts/imagenome
  images_root: /data/mimic-cxr-jpg
  pair_single_ratio: 1.0
  stratify_by_finding: true
  stratify_by_gt_progression: true
  train_classes: [improving, worsening]

prompting:
  prompt_mode: specific
  technique: "AP portable chest radiograph."
  indication: ""

sampling:
  group_size: 2                 # was 4 — half the rollouts to fit GPU 0
  max_new_tokens: 128           # was 150
  temperature: 0.9
  top_p: 0.95

reward:
  alpha_label: 1.0
  beta_no_compare: 0.0
  partial_credit: false
  change_weight: 1.0
  stable_weight: 1.0
  wrong_penalty: 1.0

judge:
  api: openai
  model: gpt-4.1-mini
  concurrency: 32
  prompt_mode: 3class

train:
  num_steps: 300
  batch_prompts: 1              # was 2 — GPU 0 fit
  lr: 5.0e-6
  weight_decay: 0.0
  kl_coef: 0.0                  # reference policy ill-defined after vision swap
  grad_clip: 1.0
  ppo_clip: 0.2
  ppo_epochs: 1
  grad_checkpointing: true
  logp_chunk_size: 1            # was 2 — half the activation chunk

eval:
  every_n_steps: 50
  n_pair_eval: 100
  n_single_eval: 0

checkpoint:
  dir: checkpoints/maira2_grpo_imagenome_v7e_sft
  save_every_n_steps: 50
  keep_last_n: 10

logging:
  out_dir: results/maira2_grpo_imagenome_v7e_sft
  log_every_n_steps: 1
