model:
  name: microsoft/maira-2
  torch_dtype: float16
  device: cuda:1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

vision_lora:
  enabled: true
  last_n_layers: 6

data:
  prompts_dir: data/rl_prompts/imagenome
  images_root: /data/mimic-cxr-jpg
  pair_single_ratio: 1.0
  stratify_by_finding: true

prompting:
  prompt_mode: specific
  technique: "AP portable chest radiograph."
  indication: ""

sampling:
  group_size: 4
  max_new_tokens: 80
  temperature: 0.9
  top_p: 0.95

reward:
  alpha_label: 1.0
  beta_no_compare: 0.0
  partial_credit: true

judge:
  api: openai
  model: gpt-4.1-mini
  concurrency: 16

train:
  num_steps: 3
  batch_prompts: 1
  lr: 5.0e-6
  weight_decay: 0.0
  kl_coef: 0.1
  grad_clip: 1.0
  ppo_clip: 0.2
  ppo_epochs: 1
  grad_checkpointing: true
  logp_chunk_size: 1

eval:
  every_n_steps: 999
  n_pair_eval: 10
  n_single_eval: 0

checkpoint:
  dir: checkpoints/maira2_grpo_imagenome_smoke
  save_every_n_steps: 999
  keep_last_n: 1

logging:
  out_dir: results/maira2_grpo_imagenome_smoke
  log_every_n_steps: 1
